#
# openWakeWord training config for "Hey Raven". Paths are inside the training container
# (/work is the data folder, /opt holds the pinned sources); see train.sh.
model_name: "hey_raven"
target_phrase:
  - "hey raven"
# Phrases that sound close and must not wake the Echo.
custom_negative_phrases:
  - "hey dicio"
  - "raven"
  - "hey ray"
  - "hey ravi"
  - "hey reverend"
  - "hey robin"
  - "hey kevin"
  - "hey heaven"
  - "hey seven"
  - "hey even"
  - "hey ravenous"
  - "hey haven"
  - "the raven"
  - "a raven"
  - "okay raven"
n_samples: 12000
n_samples_val: 2000
tts_batch_size: 50
augmentation_batch_size: 16
piper_sample_generator_path: "/opt/piper-sample-generator"
output_dir: "/work/hey_raven_model"
rir_paths:
  - "/work/mit_rirs"
background_paths:
  - "/work/audioset_16k"
  - "/work/fma"
background_paths_duplication_rate:
  - 1
  - 1
false_positive_validation_data_path: "/work/validation_set_features.npy"
augmentation_rounds: 1
feature_data_files:
  "ACAV100M_sample": "/work/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50
model_type: "dnn"
layer_size: 64
steps: 80000
max_negative_weight: 1100
target_false_positives_per_hour: 0.3
target_accuracy: 0.7
target_recall: 0.5
